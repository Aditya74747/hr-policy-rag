[project]
name = "hr-policy-rag"
version = "0.1.0"
description = "Fully local RAG system for querying HR policies, employee handbooks and compliance documents with Ollama and ChromaDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.4.0",
    "langchain>=1.2.3",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.7",
    "langchain-text-splitters>=1.1.0",
    "ipykernel>=7.1.0",
    "notebook>=7.4.0",
    "numpy>=2.4.1",
    "ollama>=0.6.1",
    "pandas>=2.3.3",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "tqdm>=4.67.1",
]
